name = "rafi-agent-trading-arena"
main = "src/index.js"
compatibility_date = "2026-08-02"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
FEE_RATE_BPS = "40"
SLIPPAGE_BPS = "5"
SYNTHETIC_SPREAD_BPS = "4"
MAX_QUOTE_AGE_SECONDS = "90"
CORS_ALLOWED_ORIGINS = "https://www.ra-fi.com,https://ra-fi.com"
OPPORTUNITY_ENGINE_BASE_URL = "https://rafi-crypto-movers.camronra2020.workers.dev"

[[durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaController"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaController"]

[observability]
enabled = true
head_sampling_rate = 1

[env.preview]
name = "rafi-agent-trading-arena-preview"

[env.preview.vars]
FEE_RATE_BPS = "40"
SLIPPAGE_BPS = "5"
SYNTHETIC_SPREAD_BPS = "4"
MAX_QUOTE_AGE_SECONDS = "90"
CORS_ALLOWED_ORIGINS = "https://preview.ra-fi.com"
OPPORTUNITY_ENGINE_BASE_URL = "https://rafi-crypto-movers.camronra2020.workers.dev"

[[env.preview.durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaController"

[env.staging]
name = "rafi-agent-trading-arena-staging"

[env.staging.vars]
SKIP_AUDIT_SCHEMA_INIT = "true"
ALLOW_COMPETITIVE_RESET = "true"
COMPETITIVE_RESET_EPOCH = "opord-rafi-002-clean-score-v1"
ARENA_UAT_MODE = "true"
FEE_RATE_BPS = "40"
SLIPPAGE_BPS = "5"
SYNTHETIC_SPREAD_BPS = "4"
MAX_QUOTE_AGE_SECONDS = "90"
CORS_ALLOWED_ORIGINS = "https://uat.ra-fi.com,https://ra-fi8-0.d25mb8wqnc3c0d.amplifyapp.com,https://ra-fi.com,https://www.ra-fi.com"
OPPORTUNITY_ENGINE_BASE_URL = "https://rafi-crypto-movers-staging.camronra2020.workers.dev"

[[env.staging.durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaController"

[env.preston_uat]
name = "rafi-agent-trading-arena-preston-uat"

[env.preston_uat.vars]
ARENA_ENVIRONMENT = "preston-anthropic-uat"
SOURCE_BASELINE_COMMIT = "4fce5001ce54838dbbbf00f903db5cdc7e3bf783"
STRATEGY_PROFILE = "PRESTON_ANTHROPIC_V1.0.0"
SKIP_AUDIT_SCHEMA_INIT = "true"
ALLOW_COMPETITIVE_RESET = "false"
ARENA_UAT_MODE = "true"
FEE_RATE_BPS = "40"
SLIPPAGE_BPS = "5"
SYNTHETIC_SPREAD_BPS = "4"
MAX_QUOTE_AGE_SECONDS = "90"
CORS_ALLOWED_ORIGINS = "https://uat.ra-fi.com"
OPPORTUNITY_ENGINE_BASE_URL = "https://rafi-crypto-movers-staging.camronra2020.workers.dev"

[[env.preston_uat.durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaController"

[env.production]
name = "rafi-agent-trading-arena-production"

[env.production.vars]
ALLOW_COMPETITIVE_RESET = "false"
FEE_RATE_BPS = "40"
SLIPPAGE_BPS = "5"
SYNTHETIC_SPREAD_BPS = "4"
MAX_QUOTE_AGE_SECONDS = "90"
CORS_ALLOWED_ORIGINS = "https://www.ra-fi.com,https://ra-fi.com"
OPPORTUNITY_ENGINE_BASE_URL = "https://rafi-crypto-movers.camronra2020.workers.dev"

[[env.production.durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaController"
